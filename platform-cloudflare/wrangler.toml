name = "emela-hello"
main = "target/emela/js/main.mjs"
compatibility_date = "2026-10-01"

[build]
command = "sh worker/build.sh"

[vars]
GREETING = "hello"

# `wrangler dev` uses a local KV; replace the id to deploy (`wrangler kv namespace create KV`).
[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

# `wrangler dev` uses a local D1; replace the id to deploy (`wrangler d1 create emela-hello`).
[[d1_databases]]
binding = "DB"
database_name = "emela-hello"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
